
<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: blue;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .output {
            margin-top: 20px;
            background: #e6f2ff;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Information</h2>

    <label>User Name:</label>
    <input type="text" id="username"
           placeholder="Enter your name">

    <label>Age:</label>
    <input type="number" id="age"
           placeholder="Enter your age">

    <label>Department:</label>
    <select id="department">
        <option value="">Select Department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Science">Information Science</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Civil">Civil</option>
    </select>

    <label>Semester:</label>
    <select id="semester">
        <option value="">Select Semester</option>
        <option value="1st Semester">1st Semester</option>
        <option value="2nd Semester">2nd Semester</option>
        <option value="3rd Semester">3rd Semester</option>
        <option value="4th Semester">4th Semester</option>
        <option value="5th Semester">5th Semester</option>
        <option value="6th Semester">6th Semester</option>
        <option value="7th Semester">7th Semester</option>
        <option value="8th Semester">8th Semester</option>
    </select>

    <button onclick="displayDetails()">
        Submit
    </button>

    <div class="output">
        <h3>Live Two-Way Binding</h3>
        <p>User Name: <span id="showName"></span></p>
        <p>Age: <span id="showAge"></span></p>
    </div>

    <div class="output" id="result"></div>
</div>

<script>
    // Get input elements
    const username = document.getElementById("username");
    const age = document.getElementById("age");

    // Two-way binding: Input to output
    username.addEventListener("input", function() {
        document.getElementById("showName").textContent =
            username.value;
    });

    age.addEventListener("input", function() {
        document.getElementById("showAge").textContent =
            age.value;
    });

    // Submit student details
    function displayDetails() {
        const dept = document.getElementById("department").value;
        const sem = document.getElementById("semester").value;

        document.getElementById("result").innerHTML =
            "<h3>Student Details</h3>" +
            "<p>Name: " + escapeHTML(username.value) + "</p>" +
            "<p>Age: " + escapeHTML(age.value) + "</p>" +
            "<p>Department: " + escapeHTML(dept) + "</p>" +
            "<p>Semester: " + escapeHTML(sem) + "</p>";
    }

    function escapeHTML(value) {
        return value.replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }
</script>

</body>
</html>
